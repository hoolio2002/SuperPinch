name: Build SuperPinch

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout SuperPinch
        uses: actions/checkout@v5

      - name: Checkout BakkesMod SDK
        uses: actions/checkout@v5
        with:
          repository: bakkesmodorg/BakkesModSDK
          path: BakkesModSDK

      - name: Set up MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check source files
        shell: pwsh
        run: |
          if (!(Test-Path "Superpinch.cpp")) {
            throw "Superpinch.cpp is missing"
          }
          if (!(Test-Path "SuperPinch.h")) {
            throw "SuperPinch.h is missing"
          }
          if (!(Test-Path "BakkesModSDK")) {
            throw "BakkesMod SDK checkout failed"
          }

      - name: Compile SuperPinch
        shell: cmd
        run: |
          cl /nologo /LD /EHsc /std:c++17 ^
            /I BakkesModSDK/include ^
            /I BakkesModSDK ^
            Superpinch.cpp ^
            /link ^
            /OUT:SuperPinch.dll

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: SuperPinch-Windows
          path: SuperPinch.dll
          if-no-files-found: error
