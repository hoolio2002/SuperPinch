name: Build SuperPinch

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout SuperPinch
        uses: actions/checkout@v4

      - name: Checkout BakkesMod SDK
        uses: actions/checkout@v4
        with:
          repository: bakkesmodorg/BakkesModSDK
          path: BakkesModSDK

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Check project files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File |
            Select-Object -ExpandProperty FullName

      - name: Build plugin
        shell: cmd
        run: |
          cl /nologo /LD /EHsc /std:c++17 ^
            /I BakkesModSDK/include ^
            Superpinch.cpp ^
            BakkesModSDK/lib/pluginsdk.lib ^
            /link /OUT:SuperPinch.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: SuperPinch-Windows
          path: SuperPinch.dll
          if-no-files-found: error
