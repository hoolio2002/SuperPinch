name: Build SuperPinch

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout BakkesMod SDK
        uses: actions/checkout@v5
        with:
          repository: bakkesmodorg/BakkesModSDK
          path: BakkesModSDK

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check source files
        shell: pwsh
        run: |
          if (!(Test-Path "Superpinch.cpp")) {
            throw "Superpinch.cpp not found"
          }
          if (!(Test-Path "SuperPinch.h")) {
            throw "SuperPinch.h not found"
          }

      - name: Compile plugin
        shell: cmd
        run: |
          cl /nologo /LD /EHsc /std:c++17 ^
            /I BakkesModSDK/include ^
            /I BakkesModSDK ^
            Superpinch.cpp ^
            /link /OUT:SuperPinch.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: SuperPinch-Windows
          path: SuperPinch.dll
          if-no-files-found: error
